# 2026-10-14: NEW - offline regression suite (no Neo4j, no Redis, no LLM, no
# Hugging Face). `@pytest.mark.live` tests are skipped automatically because
# TAXKG_LIVE_TESTS is not set here - run those on the dev machine.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # sentence-transformers is excluded: it pulls torch (~1-2GB) and its
      # models need a Hugging Face download - tests/conftest.py installs an
      # offline stand-in for it instead.
      - name: Install dependencies (minus sentence-transformers)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^\s*sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt

      - name: Guard - torch must not have been pulled in
        run: python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"

      - name: Byte-compile every module
        run: python -m compileall -q framework domain_packs tests

      - name: Run offline test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -ra
