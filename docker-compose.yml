version: "3.8"

# Same two services as tax_kg_poc/docker-compose.yml - Neo4j (KNOWLEDGE
# LAYER: property graph + native vector index) and Redis (ORCHESTRATION
# LAYER: response cache + agent state store). Neither is domain-specific -
# every domain pack shares the same running Neo4j/Redis instance, scoped by
# node labels, not by separate databases.

services:
  neo4j:
    image: neo4j:5.24-community
    container_name: tax_kg_revised_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/taxkg_neo4j_pw"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP) - http://localhost:7474
      - "7687:7687"   # Bolt (driver protocol) - what framework/core/infra/neo4j_client.py connects to
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tax_kg_revised_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  redis_data:
